<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-size: 16px; -webkit-tap-highlight-color: transparent; }
  .m-app { height: 100dvh; display: flex; flex-direction: column; }
  .m-head { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px 16px; background: var(--bg); flex: none; min-height: 56px; }
  .m-head h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: .02em; }
  .icon-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); }
  .icon-btn:active { background: var(--bg-2); }
  .icon-btn .ico { width: 22px; height: 22px; }
  .claude-pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px; background: linear-gradient(145deg, #fdf1ea, #f6dccd); color: #c15f33; font-weight: 700; font-size: 13.5px; }
  .claude-pill .ico { width: 18px; height: 18px; }
  .m-main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  /* 下部タブ: 5 つに絞る（親指で届く・迷わない数） */
  .m-tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex: none; }
  .m-tab { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; min-height: 56px; }
  .m-tab .ico { width: 24px; height: 24px; }
  .m-tab.on { color: var(--accent); }
  .m-tab .badge { position: absolute; top: 4px; left: calc(50% + 6px); height: 18px; min-width: 18px; font-size: 10.5px; }

  /* プッシュ画面（チャット・メール詳細など） */
  .m-push { position: fixed; inset: 0; z-index: 50; background: var(--surface); display: flex; flex-direction: column; height: 100dvh; transform: translateX(100%); transition: transform .28s var(--ease); box-shadow: -8px 0 24px rgba(0,0,0,.06); }
  .m-push.in { transform: none; }
  .m-push > .p-head { display: flex; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px 4px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; min-height: 56px; }
  .p-head .ttl { flex: 1; min-width: 0; font-weight: 800; font-size: 16.5px; line-height: 1.25; }
  .p-head .sub { font-size: 12px; color: var(--muted); font-weight: 500; }
  .m-push > .p-body { flex: 1; min-height: 0; overflow-y: auto; }

  /* チャット（スマホ） */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat-head { display: none; }
  .chat-scroll { flex: 1; overflow-y: auto; }
  .msg { padding: 6px 14px; grid-template-columns: 36px 1fr; gap: 0 10px; }
  .msg .avatar { --s: 36px !important; }
  .msg-tools { display: none !important; }
  .react-add { display: none; }
  .att-img { max-width: 100%; }
  .composer { padding: 6px 10px calc(env(safe-area-inset-bottom) + 8px); border-top: 1px solid var(--line); background: var(--surface); }
  .composer-box { box-shadow: none; border-radius: 22px; }
  .composer textarea { font-size: 16px; padding: 10px 14px 2px; }
  .composer-bar .hint { display: none; }
  .composer-bar { justify-content: flex-start; }
  .send-btn { margin-left: auto; width: 40px; height: 36px; border-radius: 18px; }
  .typing { padding: 0 16px; }

  /* チャット一覧 */
  .chat-list .li { padding: 12px 16px; border-bottom: 0; background: transparent; }
  .chat-list .li:active { background: var(--bg-2); }
  .chat-list .avatar, .chat-list .ch-emoji { --s: 44px; }
  .chat-list .ch-emoji { width: 44px !important; height: 44px; border-radius: 32%; background: var(--surface); border: 1px solid var(--line); font-size: 20px; }
  .chat-list .meta { display: grid; justify-items: end; gap: 4px; flex: none; }
  .list-sec { padding: 14px 16px 2px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .fab { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 74px); width: 56px; height: 56px; border-radius: 18px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(75,99,230,.35); z-index: 10; }
  .fab .ico { width: 26px; height: 26px; }

  /* 画面を詰める */
  .page { padding: 4px 16px 32px; }
  .page-head h1 { display: none; }
  .page-head { gap: 8px; margin-bottom: 12px; }
  .page-head .input[type=search] { max-width: none !important; flex: 1 1 100%; order: 10; }
  .home { padding: 0 16px 32px; }
  .home-hero { grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .home-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat { min-height: 84px; padding: 10px 10px 9px; border-radius: 14px; }
  .stat-n { font-size: 24px; }
  .stat-l { font-size: 11.5px; }
  .stat-l .l-long { display: none; } .stat-l .l-short { display: inline; }
  .stat-ico { top: 8px; right: 8px; }
  .stat-ico .ico { width: 16px; height: 16px; }
  .home-greet { padding: 0; }
  .home-greet h1 { font-size: 21px; }
  .home-grid { columns: 1; }
  .home-grid > .home-card { margin-bottom: 12px; }
  .mail.is-mobile { display: block; }
  .mail.is-mobile .mail-boxes { display: flex; gap: 6px; overflow-x: auto; padding: 4px 16px 10px; border: 0; background: transparent; scrollbar-width: none; }
  .mail.is-mobile .mail-boxes .chip { height: 32px; flex: none; }
  .mail.is-mobile .mail-list { border: 0; background: transparent; }
  .mail.is-mobile .mail-tools { border: 0; padding: 0 16px 8px; }
  .mail.is-mobile .mail-status { border: 0; padding: 0 16px 8px; }
  .mail.is-mobile .mail-items { background: var(--surface); border-top: 1px solid var(--line); }
  .mail-view { padding: 14px 16px 40px; }
  .mail-subject { font-size: 19px; }
  .mail-foot .btn { flex: 1 1 calc(50% - 8px); }
  .cal-d { min-height: 64px; padding: 3px; } .ev { font-size: 10px; padding: 1px 3px; }
  .people-grid { grid-template-columns: 1fr; }
  .file-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .task-add { flex-wrap: wrap; } .task-add .input[name=title] { flex: 1 1 100%; }

  /* モーダルはボトムシートに */
  .overlay { align-items: end; place-items: end stretch; }
  .modal { width: 100%; max-width: none; border-radius: 22px 22px 0 0; max-height: 92dvh; animation: up .26s var(--ease); padding-bottom: env(safe-area-inset-bottom); }
  .modal.wide { height: 94dvh; width: 100%; }
  .modal::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 8px auto 0; flex: none; }
  @keyframes up { from { transform: translateY(40%); opacity: .4; } }
  .modal-head .head-extra { display: flex; gap: 4px; flex-wrap: wrap; }
  .modal-head .head-extra .small.muted { display: none; }
  .modal-foot { flex-wrap: wrap; }
  .emoji-row { display: flex; justify-content: space-between; padding: 4px 0 12px; }
  .emoji-row button { width: 44px; height: 44px; font-size: 24px; border-radius: 12px; background: var(--bg); }
  .sheet-actions { display: grid; }
  .sheet-actions button { display: flex; align-items: center; gap: 12px; padding: 14px 6px; font-size: 16px; text-align: left; border-bottom: 1px solid var(--line); }
  .sheet-actions button:last-child { border-bottom: 0; }
  .sheet-actions button.danger { color: var(--danger); }
  .sheet-actions .ico { width: 20px; height: 20px; color: var(--ink-2); }
  .more-list .li { padding: 16px; }
  .more-list .ico { width: 22px; height: 22px; color: var(--ink-2); }
  .toast-wrap { bottom: calc(env(safe-area-inset-bottom) + 76px); }
  .popover { max-width: calc(100vw - 16px); }
  /* 親指で押せる大きさ（32px 以上）に揃える */
  .seg button { height: 36px; padding: 0 14px; font-size: 14px; }
  .read-mark { min-height: 32px; display: inline-grid; place-items: center; padding: 0 8px; }
  .react { height: 32px; padding: 0 10px; }
  .chip { height: 32px; }
  /* 混雑を減らす: スマホでは補助的な要素を隠し、横に並ぶものは 1 行スクロールに */
  .hide-m { display: none !important; }
  /* 予定: 日付を 1 行目いっぱい、開始・終了を 2 行目に半分ずつ */
  .ev-when { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; }
  .ev-when .f-date { grid-column: 1 / -1; }
  .modal label.row.small { min-height: 44px; }
  .modal input.input[type=date], .modal input.input[type=time] { min-height: 44px; font-size: 16px; }
  .modal .row { flex-wrap: wrap; } .modal .row > .field.grow, .modal .row > .grow { min-width: 140px; }
  .repo-head { padding: 4px 16px 6px; } .repo-search { padding: 0 16px 10px; } .repo-search .ico-in { left: 28px; top: 11px; }
  .repo-list { padding: 0 8px 24px; } .rt-row { min-height: 40px; font-size: 14.5px; }
  .m-push .repo-file .rf-head { padding: 10px 14px; } .m-push .rf-body { min-height: 60vh; } .m-push .doc-page { padding: 22px 18px; margin: 0; border-radius: 0; box-shadow: none; }
  .shift-legend { display: none !important; }
  .page-head h1.keep-title { display: block; font-size: 19px; margin: 0 4px 0 0; }
  .kind-chips, .tt-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 0 16px 4px; }
  .kind-chips .chip, .tt-tabs .chip { flex: none; }
  .tt-add { flex-wrap: wrap; padding: 8px; }
  .tt-add .input[name=title] { flex: 1 1 0; min-width: 0; }
  .tt-add .btn.primary { width: 44px; padding: 0; }
  .tt-add-more { display: none; width: 100%; gap: 8px; }
  .tt-add:focus-within .tt-add-more { display: flex; }
  .tt-add-more .input[type=date], .tt-add-more select.input { flex: 1; width: auto; }
  .home-next { padding: 10px 12px; }
  .home-calm { margin: 0 0 12px; font-size: 13.5px; }
  .mr-meta { margin-top: 2px; }
  .task-check { width: 32px; height: 32px; border-radius: 10px; }
  .tt-row { grid-template-columns: 34px minmax(0, 1fr) auto; }
  .login-card input[type=checkbox] { width: 22px; height: 22px; }
  .btn.sm { height: 36px; }
  .btn.icon { width: 40px; }
