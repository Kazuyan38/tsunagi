<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owl</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://fgqmbgmukyvgonzczsgh.supabase.co; media-src 'self' blob: https://fgqmbgmukyvgonzczsgh.supabase.co; frame-src blob: https://fgqmbgmukyvgonzczsgh.supabase.co; connect-src 'self' https://fgqmbgmukyvgonzczsgh.supabase.co wss://fgqmbgmukyvgonzczsgh.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="icon" href="img/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="core.css">
<style>
  body { overflow: hidden; }
  body.is-login { overflow: auto; }
  .app { display: grid; grid-template-columns: 76px 264px minmax(0, 1fr); height: 100vh; transition: grid-template-columns .22s cubic-bezier(.2,.8,.2,1); }
  /* サイドバーを畳んだ状態: レールだけ残し、本文を広く使う */
  .app.collapsed, .app.own-list { grid-template-columns: 76px 0 minmax(0, 1fr); }
  .app.collapsed .side, .app.own-list .side { visibility: hidden; border-right: 0; }
  .app.own-list .rail-toggle { visibility: hidden; }
  .side { overflow: hidden; }
  .rail-toggle { width: 40px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); margin: -4px 0 8px; }
  .rail-toggle:hover { background: var(--bg-2); color: var(--ink); }
  .app:not(.collapsed) .rail-toggle { color: var(--accent); background: var(--accent-soft); }

  /* 左レール: 8 つの行き先だけ。ラベルを常に出して「アイコンの意味を思い出す」負荷をなくす */
  .rail { background: #fbfbfd; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0 12px; gap: 4px; }
  .logo { width: 40px; height: 40px; margin-bottom: 10px; }
  .rail-btn { width: 62px; padding: 7px 0 5px; border-radius: 12px; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--ink-2); position: relative; transition: background .15s, color .15s; }
  .rail-btn .ico { width: 22px; height: 22px; }
  .rail-btn:hover { background: var(--bg-2); color: var(--ink); }
  .rail-btn.on { background: var(--accent-soft); color: var(--accent); }
  .rail-btn .badge { position: absolute; top: 2px; right: 6px; height: 18px; min-width: 18px; font-size: 10.5px; }
  .rail .sp { flex: 1; }
  .claude-btn { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(145deg, #fdf1ea, #f6dccd); color: #c15f33; display: grid; place-items: center; box-shadow: var(--shadow-1); margin-bottom: 4px; transition: transform .15s, box-shadow .15s; }
  .claude-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .claude-btn .ico { width: 24px; height: 24px; }
  .claude-cap { font-size: 10px; font-weight: 700; color: #c15f33; margin-bottom: 10px; }
  .me-btn { border-radius: 12px; }

  /* チャンネル一覧 */
  .side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-top { padding: 14px 12px 8px; display: grid; gap: 8px; }
  .search-btn { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
  .search-btn:hover { border-color: var(--line-2); }
  .search-btn kbd { margin-left: auto; font-family: var(--font); font-size: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .side-filter { display: flex; gap: 6px; }
  .side-filter .chip .ico { width: 14px; height: 14px; }
  .side-scroll { overflow-y: auto; flex: 1; padding: 4px 8px 16px; }
  .side-sec { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .side-sec button { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
  .side-sec button:hover { background: var(--bg-2); color: var(--ink); }
  .side-sec .ico { width: 16px; height: 16px; }
  .ch { display: flex; align-items: center; gap: 9px; width: 100%; height: 36px; padding: 0 8px; border-radius: 9px; color: var(--ink-2); font-size: 14.5px; text-align: left; }
  .ch:hover { background: var(--bg); }
  .ch.on { background: var(--accent-soft); color: var(--accent); }
  .ch.unread { color: var(--ink); font-weight: 800; }
  .ch .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch .avatar { --s: 22px; }
  .side-more { color: var(--muted); font-size: 13px; padding: 6px 8px; }
  .side-more:hover { color: var(--accent); }
  .conn { font-size: 11.5px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
  .conn .dot { background: var(--ok); } .conn.off .dot { background: var(--danger); }

  .main { min-width: 0; min-height: 0; overflow: auto; position: relative; }
  .main.chat-mode { overflow: hidden; }

  /* チャット */
  .chat { display: flex; flex-direction: column; height: 100vh; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 62px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
  .chat-head .ttl { font-size: 17px; font-weight: 800; white-space: nowrap; }
  .chat-head .topic { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .chat-scroll { flex: 1; overflow-y: auto; background: var(--surface); }
  .composer { background: var(--surface); }
  .typing { background: var(--surface); }

  .mail { height: 100vh; }
  @media (max-width: 1180px) { .mail { grid-template-columns: 150px minmax(280px, 340px) minmax(0, 1fr); } .box-btn { font-size: 13px; padding: 7px 8px; } }
  @media (max-width: 1000px) { .app:not(.collapsed) { grid-template-columns: 76px 220px minmax(0, 1fr); } .home-hero { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="owl.js"></script>
<script src="vendor/supabase-2.45.4.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="gestures.js"></script>
<script src="data.js"></script>
<script src="screens.js"></script>
<script src="repo.js"></script>
<script src="notify.js"></script>
<script src="pc.js"></script>
</body>
</html>
